<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NeuroWatch</title>
  <meta name="description" content="Clinical neuropsychology research and UK practice updates, with a dedicated motor neurone disease section.">
  <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NeuroWatch">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="offline-banner" class="banner" hidden></div>

  <header class="top">
    <div class="top-row">
      <div class="wordmark">Neuro<span>Watch</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-search" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-info" aria-label="About and sources">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
        </button>
      </div>
    </div>
    <h1 id="tab-title">—</h1>
    <p class="meta" id="meta">Loading…</p>
    <nav class="segments" role="tablist" aria-label="View" id="segments"></nav>
  </header>

  <main id="content" aria-live="polite"></main>

  <nav class="tabs" aria-label="Section">
    <button data-tab="research">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4"/><path d="M10 12h5M10 15.5h5"/></svg>
      <span class="t-name">Research</span><i class="dot" hidden></i>
    </button>
    <button data-tab="practice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="13" height="16" rx="2"/><path d="M9.5 4.5V3.5h5v1"/><path d="M9 11l2 2 4-4"/><path d="M9 16.5h6"/></svg>
      <span class="t-name">Practice</span><i class="dot" hidden></i>
    </button>
    <button data-tab="mnd">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="2.6"/><path d="M12 11.6V21M12 21l-3-2.5M12 21l3-2.5"/><path d="M10 7.3L6.5 4M14 7.3L17.5 4M9.5 10L5 11M14.5 10L19 11"/></svg>
      <span class="t-name">MND</span><i class="dot" hidden></i>
    </button>
    <button data-tab="ahead">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/><path d="M8 14h2M12 14h2M8 17h2"/></svg>
      <span class="t-name">Ahead</span>
    </button>
  </nav>

  <div class="sheet" id="search-sheet" hidden>
    <div class="sheet-panel">
      <div class="sheet-head">
        <input id="search-input" type="search" placeholder="Search everything, e.g. ECAS, tofersen, capacity" autocomplete="off">
        <button class="text-btn" data-close>Close</button>
      </div>
      <div id="search-results" class="sheet-body"></div>
    </div>
  </div>

  <div class="sheet" id="info-sheet" hidden>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2>About &amp; sources</h2>
        <button class="text-btn" data-close>Close</button>
      </div>
      <div id="info-body" class="sheet-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
